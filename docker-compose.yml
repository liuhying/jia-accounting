version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: jia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-jia_app_2026}
      MYSQL_DATABASE: jia_app
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/acc_init.sql:/docker-entrypoint-initdb.d/01_acc_init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: jia-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-jia_app_2026}
      DB_NAME: jia_app
      JWT_SECRET: ${JWT_SECRET:-jia_app_jwt_secret_2026}
      PORT: 3000
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
